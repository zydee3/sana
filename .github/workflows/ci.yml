name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    name: app / check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: make setup
      - run: make check

  scraper:
    name: scraper / check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: make setup
      - run: make check

  corpus:
    name: corpus / check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: make setup
      - run: make check
