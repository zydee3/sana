[project]
name = "sana-corpus"
version = "0.1.0"
description = "Turns the scraped corpus into retrieval-ready data: relevance scores, labels, chunks, vectors."
requires-python = ">=3.12"
# Unlike scraper/, this project may take deps (embedding runtimes, vector index);
# none needed yet — stdlib covers sampling, HTTP and the model calls.
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
